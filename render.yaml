# Optional: one-click deploy blueprint for Render.com (paid instance needed for a persistent disk).
services:
  - type: web
    name: mobile-store
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: SEED_SAMPLES
        value: "0"
    disk:
      name: store-data
      mountPath: /data
      sizeGB: 1
